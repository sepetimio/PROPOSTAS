<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta — Um produto WePost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style id="page-rule">@page { size: 440px 1200px; margin: 0; }</style>

<style>
:root{
  --papel:#F2EFE8;
  --papel-2:#FBFAF7;
  --branco:#FFFFFF;
  --tinta:#17161C;
  --tinta-2:#5F5C68;
  --tinta-3:#95919C;
  --linha:#E0DCD2;
  --roxo:#5C33D9;
  --roxo-claro:#EEE8FF;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --corpo:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'Space Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--corpo);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--tinta)}
:focus-visible{outline:2px solid var(--roxo);outline-offset:2px}

.topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;background:rgba(242,239,232,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:center}
.marca b{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.04em;line-height:.9}
.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--tinta);background:transparent;color:var(--tinta);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;transition:background .15s,color .15s}
.btn:hover{background:var(--tinta);color:var(--papel)}
.btn.sec{border-color:var(--linha);color:var(--tinta-2)}
.btn.sec:hover{background:var(--branco);color:var(--tinta);border-color:var(--tinta-3)}
.btn.roxo{background:var(--roxo);border-color:var(--roxo);color:#fff}
.btn.roxo:hover{background:#4A27B8;border-color:#4A27B8}

.palco{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.editor{padding:28px 24px 80px;min-width:0}
.painel{position:sticky;top:57px;padding:28px 24px 60px;border-left:1px solid var(--linha);background:var(--papel-2);height:calc(100vh - 57px);overflow:auto}
@media (max-width:980px){.palco{grid-template-columns:1fr}.painel{position:static;height:auto;border-left:0;border-top:1px solid var(--linha)}}

.secao-tit{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3);margin:0 0 12px}
.bloco{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:22px}
.campos{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label.f{display:block}
label.f span{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:6px}
.contador{margin-left:auto;font-weight:700;color:var(--roxo);letter-spacing:.08em}
.contador.excedeu{color:#C2372F}
label.f input,label.f select,label.f textarea{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:9px;background:var(--papel-2)}
label.f input:focus,label.f select:focus,label.f textarea:focus{background:#fff;border-color:var(--roxo);outline:none}
label.f textarea{resize:vertical;min-height:74px;line-height:1.5}

.lista{display:flex;flex-direction:column;gap:14px}
.post{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:16px;display:grid;gap:12px}
.post .cab{display:flex;align-items:center;gap:10px}
.post .num{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--roxo-claro);color:var(--roxo);padding:5px 9px;border-radius:6px}
.post .cab .ctrl{margin-left:auto;display:flex;gap:4px}
.ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--linha);background:var(--papel-2);color:var(--tinta-2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.ic:hover{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.ic.del:hover{background:#C2372F;border-color:#C2372F}

.vazio{border:1px dashed var(--linha);border-radius:14px;padding:34px 20px;text-align:center;color:var(--tinta-2);background:var(--papel-2)}
.vazio b{display:block;font-family:var(--display);font-size:16px;color:var(--tinta);margin-bottom:4px}
.rodape-editor{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}


.preview-cerca{width:440px;max-width:100%;margin:0 auto;transform-origin:top left}
.preview-nota{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);text-align:center;margin-top:14px}

.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--tinta);color:var(--papel);padding:13px 20px;border-radius:12px;font-size:13.5px;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.22);display:none}
.aviso.on{display:block}
.aviso b{color:#fff}
</style>

<!-- CSS do documento: fonte única, usada na prévia e na aba de exportação -->
<style id="css-doc"></style>
</head>
<body>

<header class="topo">
  <div class="marca"><b>Pauta.</b></div>
  <div class="acoes">
    <button class="btn sec" onclick="salvarJSON()">Exportar arquivo</button>
    <button class="btn sec" onclick="document.getElementById('arq').click()">Importar arquivo</button>
    <input type="file" id="arq" accept="application/json" hidden onchange="abrirJSON(event)">
    <button class="btn roxo" onclick="exportar('app')">PDF formato celular</button>
    <button class="btn" onclick="exportar('a4')">PDF formato desktop</button>
  </div>
</header>

<main class="palco">
  <section class="editor">
    <p class="secao-tit">Cronograma</p>
    <div class="bloco">
      <div class="campos">
        <label class="f"><span>Cliente</span>
          <input id="cliente" placeholder="Nome do cliente" oninput="setCampo('cliente',this.value)">
        </label>
        <label class="f"><span>Mês</span>
          <select id="mes" onchange="setCampo('mes',+this.value)"></select>
        </label>
        <label class="f"><span>Ano</span>
          <input id="ano" type="number" min="2020" max="2100" oninput="setCampo('ano',+this.value)">
        </label>
      </div>
    </div>

    <p class="secao-tit">Posts</p>
    <div class="lista" id="lista"></div>

    <div class="rodape-editor">
      <button class="btn" onclick="addPost()">Adicionar post</button>
      <button class="btn sec" onclick="ordenar()">Ordenar por dia</button>
      <button class="btn sec" onclick="baixarHTML('app')">Baixar HTML (celular)</button>
      <button class="btn sec" onclick="baixarHTML('a4')">Baixar HTML (desktop)</button>
      <button class="btn sec" onclick="limpar()">Limpar tudo</button>
    </div>
  </section>

  <aside class="painel">
    <p class="secao-tit">Prévia do documento</p>
    <div id="cerca" class="preview-cerca"><div id="preview"></div></div>
    <p class="preview-nota">Prévia no formato celular · 440&nbsp;px</p>
  </aside>
</main>

<div id="aviso" class="aviso"></div>

<script>
/* ============================================================
   CSS DO DOCUMENTO — string única reaproveitada na aba exportada
   ============================================================ */
const CSS_DOC = `
:root{
  --papel-2:#FBFAF7;--tinta:#17161C;--tinta-2:#5F5C68;--tinta-3:#95919C;
  --linha:#E0DCD2;--roxo:#5C33D9;--roxo-claro:#EEE8FF;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --corpo:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'Space Mono','SFMono-Regular',Consolas,monospace;
}
.doc{background:var(--papel-2);color:var(--tinta);font-family:var(--corpo);line-height:1.5}
.doc *{box-sizing:border-box}
.doc.app{width:440px;padding:34px 30px 40px}
.doc.a4{width:794px;padding:56px 62px 64px}
.doc .cabecalho{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:13px;border-bottom:1px solid var(--linha)}
.doc .cabecalho b{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.04em;line-height:.9}
.doc.a4 .cabecalho b{font-size:32px}
.doc .cabecalho .selo{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--roxo)}
.doc .capa{padding:25px 0 30px;border-bottom:2px solid var(--tinta)}
.doc.a4 .capa{padding:31px 0 39px}
.doc .capa h1{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:0 0 14px}
.doc.app .capa h1{font-size:34px}
.doc.a4 .capa h1{font-size:46px}
.doc .capa .linha-mes{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.doc .capa .mes{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--roxo)}
.doc .capa .qtd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.doc .trilha{padding-top:6px}
.doc .item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:22px 0;border-bottom:1px solid var(--linha);break-inside:avoid}
.doc.a4 .item{grid-template-columns:124px minmax(0,1fr);gap:26px;padding:26px 0}
.doc .item:last-child{border-bottom:0}
.doc .data .dia{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.05em;line-height:.9;white-space:nowrap}
.doc.a4 .data .dia{font-size:38px}
.doc .data .dia small{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:-.02em;color:var(--tinta-3);margin-left:1px}
.doc.a4 .data .dia small{font-size:16px}
.doc .data .dia.sem{color:var(--tinta-3);font-size:22px;letter-spacing:.02em}
.doc.a4 .data .dia.sem{font-size:26px}
.doc .data .semana{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);margin-top:4px;line-height:1}
.doc .indice{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.12em;color:var(--roxo);margin:0 0 6px;line-height:1}
.doc .corpo .indice{visibility:hidden}
.doc .data .formato{display:inline-block;font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo);background:var(--roxo-claro);padding:5px 8px;border-radius:6px;margin:12px 0 0;line-height:1.25;max-width:100%}
.doc.a4 .data .formato{font-size:10px;padding:6px 9px;margin-top:14px}
.doc .corpo h2{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px}
.doc.app .corpo h2{font-size:17px}
.doc.a4 .corpo h2{font-size:21px}
.doc .corpo p{margin:0;font-size:13.5px;line-height:1.62;color:var(--tinta-2);white-space:pre-wrap}
.doc .corpo .hashtags{margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;line-height:1.7;color:var(--roxo);word-spacing:.35em}
.doc.a4 .corpo .hashtags{font-size:10.5px;margin-top:14px}
.doc.a4 .corpo p{font-size:14.5px}
.doc .encerramento{padding:52px 0 20px;text-align:center;border-top:1px solid var(--linha);margin-top:28px}
.doc.a4 .encerramento{padding:70px 0 28px;margin-top:36px}
.doc .encerramento b{display:block;font-family:var(--display);font-weight:800;font-size:58px;letter-spacing:-.055em;line-height:.88}
.doc.a4 .encerramento b{font-size:84px}
.doc .encerramento i{display:flex;align-items:center;justify-content:center;gap:6px;font-style:normal;font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--tinta-2);margin-top:16px}
.doc.a4 .encerramento i{font-size:11.5px;margin-top:20px;gap:8px}
.doc .encerramento i img{height:28px;width:auto;display:block}
.doc.a4 .encerramento i img{height:35px}
`;
document.getElementById('css-doc').textContent = CSS_DOC;

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEMANA = ['dom','seg','ter','qua','qui','sex','sáb'];
const FONTES = 'https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap';

const hoje = new Date();
let estado = { cliente:'', mes:hoje.getMonth()+1, ano:hoje.getFullYear(), posts:[] };
let seq = 0;
const novoPost = () => ({id:++seq, dia:'', formato:'', headline:'', ideia:'', hashtags:''});

/* ---------------- estado ---------------- */
function setCampo(k,v){ estado[k]=v; renderPreview(); }
function setPost(id,k,v){
  const p=estado.posts.find(x=>x.id===id);
  if(!p) return;
  p[k]=v;
  if(k==='hashtags'){
    const c=document.getElementById('hc-'+id);
    if(c){ const n=contarTags(v); c.textContent=n+' de 5'; c.className='contador'+(n>5?' excedeu':''); }
  }
  renderPreview();
}

/* Aceita com ou sem #, separado por espaço ou vírgula */
function listaTags(txt){
  return (txt||'').split(/[\s,;]+/).map(t=>t.replace(/^#+/,'').trim()).filter(Boolean).map(t=>'#'+t);
}
function contarTags(txt){ return listaTags(txt).length; }
function addPost(){
  estado.posts.push(novoPost()); renderLista(); renderPreview();
  const cards=document.querySelectorAll('.post'); const last=cards[cards.length-1];
  if(last){ last.scrollIntoView({behavior:'smooth',block:'center'}); last.querySelector('input').focus(); }
}
function removerPost(id){ estado.posts=estado.posts.filter(p=>p.id!==id); renderLista(); renderPreview(); }
function mover(id,dir){
  const i=estado.posts.findIndex(p=>p.id===id), j=i+dir;
  if(i<0||j<0||j>=estado.posts.length) return;
  [estado.posts[i],estado.posts[j]]=[estado.posts[j],estado.posts[i]];
  renderLista(); renderPreview();
}
function ordenar(){
  const datas=datasResolvidas();
  const par=estado.posts.map((p,i)=>({p, t: datas[i] ? datas[i].getTime() : Infinity}));
  par.sort((a,b)=>a.t-b.t);
  estado.posts=par.map(x=>x.p);
  renderLista(); renderPreview();
}
function limpar(){
  if(!confirm('Isso apaga o cliente e todos os posts deste cronograma. Continuar?')) return;
  estado={cliente:'',mes:hoje.getMonth()+1,ano:hoje.getFullYear(),posts:[novoPost()]};
  montarSelects(); document.getElementById('cliente').value='';
  renderLista(); renderPreview();
}

/* ---------------- editor ---------------- */
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const nn = n => String(n).padStart(2,'0');

function renderLista(){
  const alvo=document.getElementById('lista');
  if(!estado.posts.length){
    alvo.innerHTML='<div class="vazio"><b>Nenhum post ainda</b>Adicione o primeiro post para começar a montar o cronograma.</div>';
    return;
  }
  alvo.innerHTML = estado.posts.map((p,i)=>`
    <article class="post">
      <div class="cab">
        <span class="num">POST ${nn(i+1)}</span>
        <div class="ctrl">
          <button class="ic" title="Subir" onclick="mover(${p.id},-1)">&#8593;</button>
          <button class="ic" title="Descer" onclick="mover(${p.id},1)">&#8595;</button>
          <button class="ic del" title="Remover" onclick="removerPost(${p.id})">&#10005;</button>
        </div>
      </div>
      <div class="campos">
        <label class="f"><span>Dia previsto <b class="contador" id="dt-${p.id}"></b></span>
          <input type="number" min="1" max="180" value="${esc(p.dia)}" placeholder="Ex.: 07" oninput="setPost(${p.id},'dia',this.value)">
        </label>
        <label class="f"><span>Formato (opcional)</span>
          <input value="${esc(p.formato)}" placeholder="Reels, carrossel, card…" oninput="setPost(${p.id},'formato',this.value)">
        </label>
      </div>
      <label class="f"><span>Headline / gancho</span>
        <input value="${esc(p.headline)}" placeholder="A frase que segura o cliente nos 3 primeiros segundos" oninput="setPost(${p.id},'headline',this.value)">
      </label>
      <label class="f"><span>Descrição da ideia</span>
        <textarea placeholder="O que o post entrega, como é executado e qual a mensagem central." oninput="setPost(${p.id},'ideia',this.value)">${esc(p.ideia)}</textarea>
      </label>
      <label class="f"><span>Hashtags <b id="hc-${p.id}" class="contador">${contarTags(p.hashtags)} de 5</b></span>
        <input value="${esc(p.hashtags)}" placeholder="escolha 5 hashtags relacionadas ao tema do post" oninput="setPost(${p.id},'hashtags',this.value)">
      </label>
    </article>`).join('');
}

/* ---------------- documento ---------------- */
/* Resolve a data real de cada post.
   Regra 1: dia acima do fim do mês transborda para o mês seguinte (15+30 = 45 -> 14/09).
   Regra 2: se o dia recomeça menor que o do post anterior, avança um mês (31 -> 01 vira 01/09). */
function datasResolvidas(){
  const saida=[]; let salto=0, anterior=null;
  estado.posts.forEach(p=>{
    const d=parseInt(p.dia);
    if(!(d>=1)){ saida.push(null); return; }
    let dt=new Date(estado.ano, estado.mes-1+salto, d);
    if(anterior && dt < anterior){ salto++; dt=new Date(estado.ano, estado.mes-1+salto, d); }
    anterior=dt; saida.push(dt);
  });
  return saida;
}
function dataCurta(dt){ return dt ? `${nn(dt.getDate())}/${nn(dt.getMonth()+1)}` : '--/--'; }

function montarDoc(modo){
  const cliente = estado.cliente.trim() || 'Nome do cliente';
  const mes = `${MESES[estado.mes-1]} de ${estado.ano}`;
  const qtd = estado.posts.length;
  const datas = datasResolvidas();
  const itens = estado.posts.map((p,i)=>{
    const dt = datas[i];
    const data = dt
      ? `<div class="dia">${nn(dt.getDate())}<small>/${nn(dt.getMonth()+1)}</small></div>`
      : `<div class="dia sem">--</div>`;
    return `
    <div class="item">
      <div class="data">
        <div class="indice">${nn(i+1)}</div>
        ${data}
        <div class="semana">${dt?SEMANA[dt.getDay()]:'a definir'}</div>
        ${p.formato.trim()?`<div class="formato">${esc(p.formato.trim())}</div>`:''}
      </div>
      <div class="corpo">
        <div class="indice" aria-hidden="true">${nn(i+1)}</div>
        <h2>${esc(p.headline.trim()||'Headline do post')}</h2>
        <p>${esc(p.ideia.trim()||'Descrição da ideia.')}</p>
        ${listaTags(p.hashtags).length?`<div class="hashtags">${esc(listaTags(p.hashtags).join(' '))}</div>`:''}
      </div>
    </div>`;
  }).join('');

  return `<div class="doc ${modo}" id="export-card">
    <div class="cabecalho"><b>Pauta.</b><span class="selo">Cronograma de postagens</span></div>
    <div class="capa">
      <h1>${esc(cliente)}</h1>
      <div class="linha-mes"><span class="mes">${mes}</span><span class="qtd">${qtd} ${qtd===1?'post':'posts'}</span></div>
    </div>
    <div class="trilha">${itens||'<div class="item"><div class="data"><div class="dia">--</div></div><div class="corpo"><h2>Sem posts</h2><p>Adicione os posts para gerar o cronograma.</p></div></div>'}</div>
    <div class="encerramento"><b>Pauta.</b><i>Um produto <img src="${MARCA_WEPOST}" alt="WePost"></i></div>
  </div>`;
}

function renderPreview(){
  document.getElementById('preview').innerHTML = montarDoc('app');
  atualizarDatas();
  ajustarEscala();
}

function atualizarDatas(){
  const datas = datasResolvidas();
  estado.posts.forEach((p,i)=>{
    const el = document.getElementById('dt-'+p.id);
    if(el) el.textContent = datas[i] ? dataCurta(datas[i]) : '';
  });
}
function ajustarEscala(){
  const cerca=document.getElementById('cerca');
  const escala=Math.min(1, cerca.parentElement.clientWidth/440);
  cerca.style.transform = escala<1 ? `scale(${escala})` : 'none';
  cerca.style.height = escala<1 ? (cerca.firstElementChild.offsetHeight*escala)+'px' : 'auto';
}
window.addEventListener('resize', ajustarEscala);

/* ============================================================
   EXPORTAÇÃO — documento autônomo que mede a si mesmo,
   define o @page na altura exata e chama a impressão.
   ============================================================ */
/* Nome usado no PDF (via título do documento) e nos arquivos baixados:
   NOME DO CLIENTE - MÊS DE ANO. Remove só o que o sistema de arquivos rejeita. */
function nomeArquivo(){
  const cliente = estado.cliente.trim() || 'Cronograma';
  const bruto = `${cliente} - ${MESES[estado.mes-1]} de ${estado.ano}`;
  return bruto.replace(/[\\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim();
}

function docAutonomo(modo, autoImprimir){
  const largura = modo==='app' ? 440 : 794;
  const titulo = nomeArquivo();
  const script = `
    (function(){
      var L=${largura};
      function medir(){
        var c=document.getElementById('export-card');
        var h=Math.ceil(c.getBoundingClientRect().height)+1;
        document.getElementById('page-rule').textContent='@page{size:'+L+'px '+h+'px;margin:0}';
        ${autoImprimir ? "setTimeout(function(){window.print();},400);" : ""}
      }
      function pronto(){ requestAnimationFrame(function(){ requestAnimationFrame(medir); }); }
      if(document.fonts && document.fonts.ready){ document.fonts.ready.then(pronto); } else { window.addEventListener('load', pronto); }
      window.addEventListener('resize', function(){ var c=document.getElementById('export-card');
        var h=Math.ceil(c.getBoundingClientRect().height)+1;
        document.getElementById('page-rule').textContent='@page{size:'+L+'px '+h+'px;margin:0}'; });
    })();`;

  return `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>${esc(titulo)}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="${FONTES}" rel="stylesheet">
<style id="page-rule">@page{size:${largura}px 1200px;margin:0}</style>
<style>
html,body{margin:0;padding:0;background:#E7E3DA}
body{display:flex;justify-content:center;padding:28px 12px}
#export-card{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 10px 40px rgba(0,0,0,.14)}
${CSS_DOC}
@media print{
  html,body{background:#fff;margin:0;padding:0;display:block}
  #export-card{box-shadow:none;margin:0}
}
</style></head>
<body>${montarDoc(modo)}
<scr`+`ipt>${script}</scr`+`ipt>
</body></html>`;
}

function exportar(modo){
  const html = docAutonomo(modo, true);
  let aba = null;
  try { aba = window.open('', '_blank'); } catch(e){ aba = null; }
  if(aba && aba.document){
    aba.document.open();
    aba.document.write(html);
    aba.document.close();
    avisar('Documento aberto em outra aba. Se o Chrome não abrir a janela de impressão, use <b>Ctrl+P</b> — margens "Nenhuma" e "Gráficos de plano de fundo" ligado.');
  } else {
    baixarArquivo(html, `${nomeArquivo()}.html`, 'text/html');
    avisar('A aba foi bloqueada aqui. Baixei o documento em HTML: <b>abra o arquivo no Chrome</b> e ele já abre a impressão sozinho.');
  }
}

function baixarHTML(modo){
  baixarArquivo(docAutonomo(modo, true), `${nomeArquivo()}.html`, 'text/html');
  avisar('Documento salvo em HTML. Abra o arquivo no Chrome — a janela de impressão abre sozinha, já no tamanho certo.');
}

function baixarArquivo(conteudo, nome, tipo){
  const blob = new Blob([conteudo], {type: tipo+';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

let timerAviso;
function avisar(msg){
  const el=document.getElementById('aviso');
  el.innerHTML=msg; el.classList.add('on');
  clearTimeout(timerAviso);
  timerAviso=setTimeout(()=>el.classList.remove('on'), 9000);
}

function aplicarEstado(d){
  estado = { cliente:d.cliente||'', mes:d.mes||1, ano:d.ano||hoje.getFullYear(), posts:(d.posts||[]) };
  estado.posts.forEach(p=>{p.id=++seq;p.formato=p.formato||'';p.dia=p.dia||'';p.headline=p.headline||'';p.ideia=p.ideia||'';p.hashtags=p.hashtags||'';});
  if(!estado.posts.length) estado.posts.push(novoPost());
  montarSelects();
  document.getElementById('cliente').value = estado.cliente;
  renderLista(); renderPreview();
}

/* ---------------- rascunho em arquivo (backup / outro computador) ---------------- */
function salvarJSON(){
  baixarArquivo(JSON.stringify(estado,null,2), `${nomeArquivo()}.json`, 'application/json');
}
function abrirJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{ aplicarEstado(JSON.parse(r.result)); avisar('Cronograma importado.'); }
    catch(e){ avisar('Não consegui ler esse arquivo. Selecione um rascunho exportado pelo Pauta.'); }
  };
  r.readAsText(f); ev.target.value='';
}

/* ---------------- início ---------------- */
function montarSelects(){
  document.getElementById('mes').innerHTML =
    MESES.map((m,i)=>`<option value="${i+1}" ${i+1===estado.mes?'selected':''}>${m}</option>`).join('');
  document.getElementById('ano').value = estado.ano;
}
montarSelects();
estado.posts.push(novoPost());
renderLista();
renderPreview();
</script>
</body>
</html>
