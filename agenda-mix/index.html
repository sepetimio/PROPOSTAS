<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda Mix · Oportunidades da semana</title>
<meta name="description" content="As oportunidades da semana para a Conveniência Mix. Escolha o que vamos trabalhar.">
<meta property="og:title" content="Agenda Mix · Oportunidades da semana">
<meta property="og:description" content="Jogos, datas e oportunidades de quarta a domingo. Escolha o que vamos trabalhar.">
<meta property="og:image" content="https://sepetimio.github.io/PROPOSTAS/agenda-mix/assets/capa.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#17120D">
<style>
@font-face{font-family:Fred;font-weight:500;src:url(assets/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Fred;font-weight:600;src:url(assets/fredoka-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Fred;font-weight:700;src:url(assets/fredoka-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Mont;font-weight:600;src:url(assets/Montserrat-600.woff2) format("woff2")}
@font-face{font-family:Mont;font-weight:700;src:url(assets/Montserrat-700.woff2) format("woff2")}
:root{--tinta:#17120D;--tinta2:#221A13;--tinta3:#2E241B;--creme:#F5EBDD;--muted:#BFAA87;--cobre:#E39A55;--amar:#F2B33D;--linha:rgba(245,235,221,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--tinta)}
body{font-family:Mont,system-ui,sans-serif;font-weight:600;color:var(--creme);background:var(--tinta);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:120px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
/* topo com padrão geométrico */
.topo{position:relative;overflow:hidden;padding:34px 0 30px}
.padrao{position:absolute;inset:0;opacity:.95}
.padrao svg{width:100%;height:100%;display:block}
.topo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,18,13,.15),rgba(23,18,13,.55) 55%,var(--tinta) 100%)}
.topo .wrap{position:relative;z-index:2;text-align:center}
.logo{display:inline-block;background:var(--tinta);border-radius:40px;padding:12px 24px 10px;border:3px solid var(--amar);box-shadow:0 6px 0 var(--tinta)}
.logo img{height:34px;display:block}
h1{font-family:Fred;font-weight:700;font-size:54px;line-height:1;margin-top:22px;color:var(--creme);paint-order:stroke fill;-webkit-text-stroke:12px var(--tinta);filter:drop-shadow(0 6px 0 var(--tinta))}
.sem{display:inline-block;margin-top:14px;background:var(--amar);color:var(--tinta);font-family:Fred;font-weight:700;font-size:19px;padding:9px 18px;border-radius:12px;border:3px solid var(--tinta);box-shadow:0 5px 0 var(--tinta);transform:rotate(-1.5deg)}
.nota{max-width:520px;margin:18px auto 0;font-size:15px;line-height:1.5;color:var(--creme);opacity:.92}
/* como funciona */
.passos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 8px}
.passo{background:var(--tinta2);border:1px solid var(--linha);border-radius:14px;padding:12px 12px 13px}
.passo b{display:block;font-family:Fred;font-weight:700;font-size:22px;color:var(--amar);line-height:1}
.passo span{display:block;font-size:12.5px;line-height:1.35;margin-top:6px;color:var(--muted)}
/* filtros */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.f{flex:none;font-family:Fred;font-weight:600;font-size:14px;color:var(--creme);background:var(--tinta2);border:1.5px solid var(--linha);padding:8px 14px;border-radius:30px;cursor:pointer}
.f.on{background:var(--creme);color:var(--tinta);border-color:var(--creme)}
/* dias */
.dia{margin-top:26px}
.dhead{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:2px dashed rgba(242,179,61,.35);margin-bottom:12px}
.dhead h2{font-family:Fred;font-weight:700;font-size:30px;line-height:1;color:var(--creme)}
.dhead .dt{font-family:Fred;font-weight:600;font-size:18px;color:var(--amar)}
.dhead .qt{margin-left:auto;font-size:12px;color:var(--muted)}
.vazio{font-size:14px;color:var(--muted);padding:6px 2px}
.card{position:relative;background:var(--tinta2);border:1.5px solid var(--linha);border-radius:18px;padding:16px 16px 14px;margin-bottom:12px;transition:border-color .2s,background .2s,transform .2s}
.card.sel{border-color:var(--amar);background:#2A2015;box-shadow:0 0 0 2px rgba(242,179,61,.25) inset}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:Fred;font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:20px;line-height:1.2}
.t-futebol{background:#1F6B3F;color:#E9F7EE}
.t-data{background:#7C3A8C;color:#F7ECFA}
.t-comercial{background:var(--cobre);color:var(--tinta)}
.t-cidade{background:#2D6C8C;color:#EAF6FB}
.t-casa{background:var(--creme);color:var(--tinta)}
.pot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.pot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.35}
.pot i.on{background:var(--amar);opacity:1}
.hora{margin-left:auto;font-family:Fred;font-weight:600;font-size:13.5px;color:var(--amar)}
.card h3{font-family:Fred;font-weight:700;font-size:23px;line-height:1.12;margin:11px 0 8px;color:var(--creme)}
.card p{font-size:14px;line-height:1.5;color:#E3D6C2}
.ideia{margin-top:10px;background:rgba(242,179,61,.08);border-left:3px solid var(--amar);border-radius:0 10px 10px 0;padding:9px 12px}
.ideia small{display:block;font-family:Fred;font-weight:600;font-size:12px;letter-spacing:1.5px;color:var(--amar);margin-bottom:3px}
.ideia p{color:var(--creme)}
.btn{margin-top:13px;width:100%;font-family:Fred;font-weight:700;font-size:16px;padding:12px 14px;border-radius:12px;cursor:pointer;border:2px solid var(--amar);background:transparent;color:var(--amar);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.card.sel .btn{background:var(--amar);color:var(--tinta)}
.btn:active{transform:scale(.98)}
/* radar */
.radar{margin-top:32px;background:var(--tinta2);border:1.5px dashed rgba(227,154,85,.45);border-radius:18px;padding:16px 16px 14px}
.radar h4{font-family:Fred;font-weight:700;font-size:20px;color:var(--cobre);margin-bottom:8px}
.radar li{list-style:none;font-size:14px;line-height:1.5;color:#E3D6C2;padding-left:16px;position:relative;margin-bottom:6px}
.radar li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:50%;background:var(--cobre)}
.obs{margin-top:22px}
.obs label{display:block;font-family:Fred;font-weight:600;font-size:16px;margin-bottom:8px}
.obs textarea{width:100%;min-height:86px;background:var(--tinta2);border:1.5px solid var(--linha);border-radius:14px;color:var(--creme);font:600 14px/1.5 Mont,system-ui;padding:12px 14px;resize:vertical}
.obs textarea:focus{outline:none;border-color:var(--amar)}
.ant{margin-top:26px;text-align:center}
.ant select{background:var(--tinta2);color:var(--creme);border:1.5px solid var(--linha);border-radius:10px;padding:8px 12px;font:600 13px Mont,system-ui}
.rod{text-align:center;font-size:12px;color:var(--muted);margin-top:28px;line-height:1.6}
/* barra fixa */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(23,18,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--linha);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.barra .wrap{display:flex;align-items:center;gap:12px}
.cont{font-size:13px;color:var(--muted);line-height:1.3}
.cont b{display:block;font-family:Fred;font-weight:700;font-size:20px;color:var(--creme)}
.env{margin-left:auto;font-family:Fred;font-weight:700;font-size:16px;background:#25D366;color:#0B2614;border:none;border-radius:14px;padding:13px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #128C4A}
.env[disabled]{background:#3A3028;color:#8D7D69;box-shadow:none;cursor:default}
.env svg{width:20px;height:20px}
@media (max-width:420px){h1{font-size:44px}.passo span{font-size:11.5px}.card h3{font-size:21px}}
</style>
</head>
<body>
<header class="topo">
  <div class="padrao" id="padrao"></div>
  <div class="wrap">
    <div class="logo"><img src="assets/logo-creme.svg" alt="Conveniência Mix"></div>
    <h1>Agenda Mix</h1>
    <div class="sem" id="semTitulo"></div>
    <p class="nota" id="nota"></p>
  </div>
</header>
<main class="wrap">
  <div class="passos">
    <div class="passo"><b>1</b><span>Veja o que rola de quarta a domingo</span></div>
    <div class="passo"><b>2</b><span>Marque o que quer trabalhar</span></div>
    <div class="passo"><b>3</b><span>Envie pra gente e montamos a divulgação</span></div>
  </div>
  <div class="filtros" id="filtros"></div>
  <section id="dias"></section>
  <div class="radar" id="radar"></div>
  <div class="obs">
    <label for="obs">Quer acrescentar alguma coisa?</label>
    <textarea id="obs" placeholder="Ex.: na sexta vamos ter música ao vivo, dá pra incluir?"></textarea>
  </div>
  <div class="ant" id="ant"></div>
  <p class="rod">Curadoria WePost para a Conveniência Mix<br>Posto Eco Drive · BR-010, 1346 · Bacuri · Imperatriz-MA</p>
</main>
<div class="barra">
  <div class="wrap">
    <div class="cont"><b id="qtd">0 escolhas</b><span id="qtdSub">Marque as oportunidades</span></div>
    <button class="env" id="env" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg>
      Enviar escolhas
    </button>
  </div>
</div>
<script src="semanas.js"></script>
<script>
(function(){
  const A = window.AGENDA_MIX;
  const TIPOS = {futebol:"Futebol", data:"Data especial", comercial:"Comercial", cidade:"Na cidade", casa:"Da casa"};
  const params = new URLSearchParams(location.search);
  let semana = A.semanas.find(s => s.id === params.get("semana")) || A.semanas[0];
  let filtro = "todos";
  const KEY = () => "agendamix_" + semana.id;
  let sel = new Set();
  function load(){ try{ sel = new Set(JSON.parse(localStorage.getItem(KEY())||"[]")); }catch(e){ sel = new Set(); }
    try{ document.getElementById("obs").value = localStorage.getItem(KEY()+"_obs")||""; }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY(), JSON.stringify([...sel])); }catch(e){} }

  // padrão geométrico do topo
  (function(){
    const P=["#E8892E","#F2B33D","#C8642A","#F5EBDD","#2A1710"], S=60, cols=14, rows=6; let g="", r=7;
    const rnd=()=>{r=(r*9301+49297)%233280; return r/233280};
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const bg=P[Math.floor(rnd()*P.length)]; let fg=P[Math.floor(rnd()*P.length)]; if(fg===bg) fg=P[(P.indexOf(bg)+2)%P.length];
      const X=x*S,Y=y*S,k=Math.floor(rnd()*5),rot=[0,90,180,270][Math.floor(rnd()*4)],c=`${X+S/2} ${Y+S/2}`;
      g+=`<g transform="rotate(${rot} ${c})"><rect x="${X}" y="${Y}" width="${S}" height="${S}" fill="${bg}"/>`;
      if(k===0) g+=`<path d="M${X},${Y} L${X+S},${Y} A${S},${S} 0 0 1 ${X},${Y+S} Z" fill="${fg}"/>`;
      if(k===1) g+=`<path d="M${X},${Y+S} A${S/2},${S/2} 0 0 1 ${X+S},${Y+S} Z" fill="${fg}"/>`;
      if(k===2) g+=`<path d="M${X},${Y} L${X+S},${Y+S} L${X},${Y+S} Z" fill="${fg}"/>`;
      if(k===3) g+=`<circle cx="${X+S/2}" cy="${Y+S/2}" r="${S*.33}" fill="none" stroke="${fg}" stroke-width="${S*.15}"/>`;
      if(k===4) g+=`<circle cx="${X+S/2}" cy="${Y+S/2}" r="${S*.38}" fill="${fg}"/>`;
      g+=`</g>`;
    }
    document.getElementById("padrao").innerHTML=`<svg viewBox="0 0 ${cols*S} ${rows*S}" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
  })();

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

  function render(){
    document.getElementById("semTitulo").textContent = "Semana de " + semana.titulo;
    document.getElementById("nota").textContent = semana.nota || "";
    const tiposUsados = [...new Set(semana.dias.flatMap(d=>d.itens.map(i=>i.tipo)))];
    document.getElementById("filtros").innerHTML = ["todos",...tiposUsados].map(t=>
      `<button class="f ${filtro===t?"on":""}" data-f="${t}">${t==="todos"?"Tudo":TIPOS[t]}</button>`).join("");
    document.getElementById("dias").innerHTML = semana.dias.map(d=>{
      const itens = d.itens.filter(i=>filtro==="todos"||i.tipo===filtro);
      return `<div class="dia"><div class="dhead"><h2>${esc(d.dia)}</h2><span class="dt">${esc(d.data)}</span><span class="qt">${d.itens.length} ${d.itens.length===1?"oportunidade":"oportunidades"}</span></div>
      ${itens.length? itens.map(i=>`
        <article class="card ${sel.has(i.id)?"sel":""}" data-id="${i.id}">
          <div class="tags"><span class="chip t-${i.tipo}">${TIPOS[i.tipo]}</span>
            <span class="pot"><i class="on"></i><i class="${i.potencial==="alto"?"on":""}"></i> ${i.potencial==="alto"?"Potencial alto":"Potencial médio"}</span>
            <span class="hora">${esc(i.hora||"")}</span></div>
          <h3>${esc(i.titulo)}</h3>
          <p>${esc(i.porque)}</p>
          <div class="ideia"><small>IDEIA DE AÇÃO</small><p>${esc(i.ideia)}</p></div>
          <button class="btn">${sel.has(i.id)?"✓ Vamos trabalhar essa":"Quero trabalhar essa"}</button>
        </article>`).join("") : `<p class="vazio">Nada desse tipo neste dia.</p>`}
      </div>`;
    }).join("");
    const rd = semana.radar||[];
    const radar = document.getElementById("radar");
    radar.style.display = rd.length? "block":"none";
    radar.innerHTML = `<h4>No radar</h4><ul>${rd.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`;
    const ant = document.getElementById("ant");
    ant.innerHTML = A.semanas.length>1 ? `<select id="selSem">${A.semanas.map(s=>`<option value="${s.id}" ${s.id===semana.id?"selected":""}>Semana de ${esc(s.titulo)}</option>`).join("")}</select>` : "";
    barra();
  }
  function barra(){
    const n=sel.size;
    document.getElementById("qtd").textContent = n + (n===1?" escolha":" escolhas");
    document.getElementById("qtdSub").textContent = n? "Pronto para enviar" : "Marque as oportunidades";
    document.getElementById("env").disabled = !n;
  }
  document.addEventListener("click",e=>{
    const f=e.target.closest(".f"); if(f){filtro=f.dataset.f; render(); return;}
    const b=e.target.closest(".btn"); if(b){const id=b.closest(".card").dataset.id; sel.has(id)?sel.delete(id):sel.add(id); save(); render(); return;}
  });
  document.addEventListener("change",e=>{ if(e.target.id==="selSem"){ semana=A.semanas.find(s=>s.id===e.target.value); load(); render(); }});
  document.getElementById("obs").addEventListener("input",e=>{ try{localStorage.setItem(KEY()+"_obs",e.target.value)}catch(_){}} );
  document.getElementById("env").addEventListener("click",()=>{
    const linhas=[];
    semana.dias.forEach(d=>d.itens.forEach(i=>{ if(sel.has(i.id)) linhas.push(`• ${d.dia} ${d.data}: ${i.titulo}`); }));
    const obs=document.getElementById("obs").value.trim();
    let msg=`Olá, WePost! Escolhas da Agenda Mix (semana de ${semana.titulo}):\n\n${linhas.join("\n")}`;
    if(obs) msg+=`\n\nObservações: ${obs}`;
    window.open(`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank");
  });
  load(); render();
})();
</script>
</body>
</html>
